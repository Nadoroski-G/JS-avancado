<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1 class="text-center">Agendas</h1>
        <input type="hidden" id="id">
        <label for="nome">Informe nome</label>
        <input type="text" id="nome" placeholder="Ex: Ana" class="form-control">
        <label for="email">Informe email</label>
        <input type="email" id="email" placeholder="Ex: Ana@exemplo.com" class="form-control">
        <label for="fone">Informe telefone</label>
        <input type="tel" id="fone" placeholder="Ex: (47)99090-0909" class="form-control">
        <div>
            <button onclick="salvar()" class="mt-3 btn btn-primary">Salvar</button>
            <button class="mt-3 btn btn-secondary">Alterar</button>
        </div>

        <div id="message" class="mt-2 text-danger"></div>

        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Editar</th>
                    <th>Excluir</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementsByClassName('btn-secondary')[0].style = 'display:none'
            document.getElementsByClassName('btn-primary')[0].style = 'display:block'

             let linhas = ''
            const baseUrl = 'http://localhost:3000/contatos'
            //     fetch(baseUrl)
            //         .then(data => data.json())
            //         .then(resp => {
            //             for (let i = 0; i < resp.length; i++) {
            //                 linhas += `<tr>
            //                                 <td>${resp[i].nome}</td>
            //                                 <td>${resp[i].email}</td>
            //                                 <td>${resp[i].fone}</td>
            //                                 <td><button onclick=editar('${resp[i].id}')>Editar</button></td>
            //                                 <td><button onclick=deletar('${resp[i].id}')>Deletar</button></td>
            //                            </tr>`
            //             }
            //             document.getElementsByTagName('tbody')[0].innerHTML = linhas
            //         })


                    //      })

                         var data = await fetch(baseUrl)
                         var resp = await data.json()
                         displayDados(resp)
                    })

            function displayDados(resp) {
                let linhas = ''
                for (let i = 0; i < resp.length; i++) {
                    linhas += ` <tr>
                                <td>${resp[i].nome}</td>
                                <td>${resp[i].email}</td>
                                <td>${resp[i].fone}</td>
                                <td><button onclick=editar('${resp[i].id}')>Editar</button></td>
                                <td><button onclick=deletar('${resp[i].id}')>Deletar</button></td>
                            </tr>`
                }
                document.getElementsByTagName('tbody')[0].innerHTML = linhas
            }


            function salvar() {
                const baseUrl = 'http://localhost:3000/contatos'
                const inputNome = document.getElementById('nome')
                const inputEmail = document.getElementById('email')
                const inputFone = document.getElementById('fone')
                const message = document.getElementById('message')

                if (inputNome.value.trim() === '') {
                    message.innerHTML = "O nome deve ser informado"
                    inputNome.focus()
                    return
                }

                if (inputEmail.value.trim() === '') {
                    message.innerHTML = "O email deve ser informado"
                    inputEmail.focus()
                    return
                }

                if (inputFone.value.trim() === '') {
                    message.innerHTML = "O telefone deve ser informado"
                    inputFone.focus()
                    return
                }

                const contato = {
                    nome: inputNome.value,
                    email: inputEmail.value,
                    fone: inputFone.value
                }

                fetch(baseUrl, {
                    method: 'POST',
                    body: JSON.stringify(contato),
                    headers: { 'Content-Type': 'application/json' }
                })
                    .then(() => {
                        message.innerHTML = "Contato salvo com sucesso!"
                        inputNome.value = ''
                        inputEmail.value = ''
                        inputFone.value = ''
                    })
            }

            function deletar(id) {
                const baseUrl = `http://localhost:3000/contatos/${id}`
                fetch(baseUrl, {
                    method: 'DELETE'
                })
            }

            function editar(id) {
                document.getElementsByClassName('btn-primary')[0].style = 'display:none'
                document.getElementsByClassName('btn-secondary')[0].style = 'display:block'
                const baseUrl = `http://localhost:3000/contatos/${id}`
                fetch(baseUrl)
                    .then(data => data.json())
                    .then(resp => {
                        document.getElementById('id').value = resp.id
                        document.getElementById('nome').value = resp.nome
                        document.getElementById('email').value = resp.email
                        document.getElementById('fone').value = resp.fone
                    })
            }
            document.getElementsByClassName('btn-secondary')[0].addEventListener('click', () => {
                const id = document.getElementById('id').value
                const baseUrl = `http://localhost:3000/contatos/${id}`

                const inputNome = document.getElementById('nome')
                const inputEmail = document.getElementById('email')
                const inputFone = document.getElementById('fone')

                if (inputNome.value.trim() === '') {
                    message.innerHTML = "O nome deve ser informado"
                    inputNome.focus()
                    return
                }

                if (inputEmail.value.trim() === '') {
                    message.innerHTML = "O email deve ser informado"
                    inputEmail.focus()
                    return
                }

                if (inputFone.value.trim() === '') {
                    message.innerHTML = "O telefone deve ser informado"
                    inputFone.focus()
                    return
                }

                const contato = {
                    id,
                    nome: inputNome.value,
                    email: inputEmail.value,
                    fone: inputFone.value
                }

                fetch(baseUrl, {
                    method: 'PUT',
                    body: JSON.stringify(contato),
                    headers: { 'content-type': 'application/JSON' }
                })
            })
    </script>
</body>

</html>
